<!DOCTYPE html>
<html>
<head>
    <title>TikTok Alert Overlay</title>
    <style>
        :root {
            --img-width: 400px;
            --font-size: 36px;
            --text-color: #ffffff;
            --font-family: 'Arial';
            --border-radius: 15px;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent; 
            font-family: var(--font-family), sans-serif;
        }
        #alert-container {
            position: absolute;
            display: none;
            text-align: center;
            width: auto;
            max-width: 90%;
            z-index: 9999;
        }
        
        /* Positions */
        .pos-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .pos-top-left { top: 30px; left: 30px; }
        .pos-top-right { top: 30px; right: 30px; }
        .pos-bottom-left { bottom: 30px; left: 30px; }
        .pos-bottom-right { bottom: 30px; right: 30px; }

        #media-container {
            width: var(--img-width);
            margin: 0 auto;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
            overflow: hidden;
            border-radius: var(--border-radius);
        }
        #alert-image, #alert-video {
            width: 100%;
            display: none;
            border-radius: var(--border-radius);
            object-fit: cover;
        }
        #alert-text {
            color: var(--text-color);
            font-size: var(--font-size);
            font-family: var(--font-family), sans-serif;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,1), 0 0 20px rgba(255, 255, 255, 0.3);
            background: rgba(0,0,0,0.6);
            padding: 15px 40px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 20px;
            white-space: nowrap;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(100px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(1.05); } 70% { transform: scale(0.9); } 100% { transform: scale(1); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(3); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.8); } }

        .anim-fade { animation: fadeIn 0.5s ease-out forwards; }
        .anim-slide { animation: slideUp 0.5s ease-out forwards; }
        .anim-bounce { animation: bounceIn 0.8s forwards; }
        .anim-zoom { animation: zoomIn 0.5s ease-out forwards; }
        .anim-out { animation: fadeOut 0.5s ease-in forwards; }
    </style>
</head>
<body>
    <div id="alert-container" class="pos-center">
        <div id="media-container">
            <img id="alert-image" src="" alt="Alert">
            <video id="alert-video" playsinline></video>
        </div>
        <div id="alert-text">WELCOME</div>
    </div>
    <audio id="alert-audio"></audio>

    <!-- Unlock Screen: Click once to enable audio autoplay -->
    <div id="unlock-screen" style="
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 99999; cursor: pointer;
        font-family: Arial, sans-serif;
    ">
        <div style="text-align: center; color: white;">
            <div style="font-size: 60px; margin-bottom: 20px;">🔊</div>
            <div style="font-size: 28px; font-weight: bold; margin-bottom: 10px;">Nhấn để bắt đầu</div>
            <div style="font-size: 16px; color: #aaa;">Kích hoạt âm thanh cho Overlay</div>
            <div style="
                margin-top: 30px; padding: 15px 50px;
                background: #22c55e; border-radius: 50px;
                font-size: 20px; font-weight: bold;
                box-shadow: 0 0 30px rgba(34,197,94,0.6);
                animation: pulse 1.5s infinite;
            ">Click vào đây ▶</div>
        </div>
    </div>
    <style>
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>

    <script>
        const container = document.getElementById('alert-container');
        const text = document.getElementById('alert-text');
        const audio = document.getElementById('alert-audio');
        const img = document.getElementById('alert-image');
        const video = document.getElementById('alert-video');

        let globalSettings = {};
        let currentEffect = 'Fade In';
        let previewTimer = null;

        // Dynamic Server Connection
        const params = new URLSearchParams(window.location.search);
        const serverAddr = params.get('server') || window.location.host;
        // Auto detect protocol: wss for https, ws for http
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        
        let socket;
        function connectWebSocket() {
            console.log(`Connecting to Backend: ${protocol}//${serverAddr}/ws`);
            socket = new WebSocket(`${protocol}//${serverAddr}/ws`);

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'alert') {
                    if (msg.isPreview) {
                        showAlert(msg); // Preview always shows immediately
                    } else {
                        enqueueAlert(msg); // Real alerts queue up
                    }
                } else if (msg.type === 'settings') {
                    globalSettings = msg.data;
                    applyUI(globalSettings);
                }
            };

            socket.onclose = () => {
                console.log("WebSocket disconnected. Reconnecting in 5s...");
                setTimeout(connectWebSocket, 5000);
            };

            socket.onerror = (err) => {
                console.error("WebSocket error observed:", err);
                socket.close(); // Force close to trigger onclose and reconnect
            };
        }

        connectWebSocket();

        function getRadius(shape) {
            if (shape === 'Circle') return '50%';
            if (shape === 'Rounded') return '25px';
            return '0%';
        }

        function applyUI(settings) {
            document.documentElement.style.setProperty('--img-width', `${settings.img_size}px`);
            document.documentElement.style.setProperty('--font-size', `${settings.font_size}px`);
            document.documentElement.style.setProperty('--text-color', settings.text_color);
            if (settings.font_family) document.documentElement.style.setProperty('--font-family', settings.font_family);
            document.documentElement.style.setProperty('--border-radius', getRadius(settings.shape));
            
            if (settings.effect) currentEffect = settings.effect;

            if (settings.position) {
                container.classList.remove('pos-center', 'pos-top-left', 'pos-top-right', 'pos-bottom-left', 'pos-bottom-right');
                const posClass = 'pos-' + settings.position.toLowerCase().replace(' ', '-');
                container.classList.add(posClass);
            }
        }

        function getMimeType(filename) {
            if (filename.endsWith('.mp4')) return 'video/mp4';
            if (filename.endsWith('.webm')) return 'video/webm';
            if (filename.endsWith('.gif')) return 'image/gif';
            if (filename.endsWith('.png')) return 'image/png';
            if (filename.endsWith('.jpg') || filename.endsWith('.jpeg')) return 'image/jpeg';
            if (filename.endsWith('.mp3')) return 'audio/mpeg';
            if (filename.endsWith('.wav')) return 'audio/wav';
            return 'application/octet-stream';
        }

        // === ALERT QUEUE SYSTEM ===
        let alertQueue = [];
        let isShowingAlert = false;

        function enqueueAlert(data) {
            alertQueue.push(data);
            if (!isShowingAlert) processNextAlert();
        }

        function processNextAlert() {
            if (alertQueue.length === 0) {
                isShowingAlert = false;
                return;
            }
            isShowingAlert = true;
            const data = alertQueue.shift();
            showAlert(data);
        }
        // ==========================

        function showAlert(data) {
            const settings = {...globalSettings, ...data.custom_settings};
            applyUI(settings);

            let welcome = settings.welcome_text || "CHÀO MỪNG";
            text.innerText = `${welcome}: ${data.nickname}`;

            const isVideo = data.media.endsWith('.mp4') || data.media.endsWith('.webm');
            
            // Build paths (Base64 data or User Static or Bundled)
            let mediaSrc, audioSrc;
            if (data.mediaData) {
                mediaSrc = `data:${getMimeType(data.media)};base64,${data.mediaData}`;
            } else {
                const baseUrl = settings.asset_base_url || "";
                if (baseUrl) {
                    mediaSrc = baseUrl + data.media;
                } else {
                    // Try local user_static first, then fall back to bundled static
                    mediaSrc = `/user_static/${data.media}`;
                }
                mediaSrc += `?t=${Date.now()}`;
            }

            if (data.audioData) {
                audioSrc = `data:${getMimeType(data.audio)};base64,${data.audioData}`;
            } else {
                const baseUrl = settings.asset_base_url || "";
                if (baseUrl) {
                    audioSrc = baseUrl + data.audio;
                } else {
                    // Try local voices first
                    audioSrc = `/voices/${data.audio}`;
                }
                audioSrc += `?t=${Date.now()}`;
            }

            if (isVideo) {
                img.style.display = 'none';
                video.style.display = 'block';
                video.src = mediaSrc;
                if (!data.isPreview) video.play(); else { video.currentTime = 0; video.pause(); }
            } else {
                video.style.display = 'none';
                img.style.display = 'block';
                img.src = mediaSrc;
            }

            container.style.display = 'block';
            
            if (!data.isPreview) {
                container.classList.remove('anim-fade', 'anim-slide', 'anim-bounce', 'anim-zoom', 'anim-out');
                void container.offsetWidth; 
                if (currentEffect === 'Fade In') container.classList.add('anim-fade');
                else if (currentEffect === 'Slide Up') container.classList.add('anim-slide');
                else if (currentEffect === 'Bounce In') container.classList.add('anim-bounce');
                else if (currentEffect === 'Zoom In') container.classList.add('anim-zoom');
                
                audio.src = audioSrc;
                audio.play().catch(e => console.log("Auto-play blocked:", e));

                let finished = false;
                const finish = () => {
                    if (finished) return;
                    finished = true;
                    hideAlert(() => processNextAlert());
                };
                audio.onended = finish;
                if (isVideo) video.onended = finish;
                // Fallback timeout: 10s max per alert
                setTimeout(finish, 10000); 
            } else {
                container.classList.remove('anim-out');
                setTimeout(hideAlert, 5000);
            }
        }

        function hideAlert(callback) {
            container.classList.add('anim-out');
            setTimeout(() => {
                container.style.display = 'none';
                video.pause();
                applyUI(globalSettings);
                if (callback) callback();
            }, 500);
        }


        // === UNLOCK AUDIO ON FIRST CLICK ===
        const unlockScreen = document.getElementById('unlock-screen');
        let audioUnlocked = false;

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            // Play and immediately pause to unlock browser audio policy
            audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
            audio.play().then(() => {
                audio.pause();
                audio.src = '';
            }).catch(() => {});
            video.play().then(() => video.pause()).catch(() => {});
            // Hide unlock screen
            unlockScreen.style.transition = 'opacity 0.4s';
            unlockScreen.style.opacity = '0';
            setTimeout(() => unlockScreen.style.display = 'none', 400);
        }

        unlockScreen.addEventListener('click', unlockAudio);
        // ===========================================

        // Auto-attempt unlock on page load (works in TikTok Live Studio, OBS, Streamlabs, etc.)
        const silentAudio = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
        audio.src = silentAudio;
        const autoplay = audio.play();
        if (autoplay !== undefined) {
            autoplay.then(() => {
                // Success: streaming software allows autoplay → unlock immediately
                audio.pause();
                audio.src = '';
                audioUnlocked = true;
                unlockScreen.style.transition = 'opacity 0.4s';
                unlockScreen.style.opacity = '0';
                setTimeout(() => unlockScreen.style.display = 'none', 400);
            }).catch(() => {
                // Blocked: regular browser → keep unlock screen visible for manual click
                audio.src = '';
            });
        }

        document.body.onclick = () => unlockAudio();
    </script>
</body>
</html>
